name: Lua Obfuscate

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "obfuscated/**"

permissions:
  contents: write

jobs:
  obfuscate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download DarkLua
        run: |
          curl -sSL -o darklua.tar.gz https://github.com/seaofvoices/darklua/releases/download/v0.18.0/darklua_0.18.0_linux_x86_64-unknown-linux-musl.tar.gz
          tar -xzf darklua.tar.gz
          chmod +x darklua

      - name: Obfuscate Lua files
        run: |
          rm -rf obfuscated
          mkdir -p obfuscated

          while IFS= read -r -d '' file; do
            mkdir -p "obfuscated/$(dirname "$file")"
            ./darklua process --config .darklua.json "$file" "obfuscated/$file"
          done < <(find . -type f -name "*.lua" \
            ! -path "./obfuscated/*" \
            ! -path "./.git/*" \
            -print0)

      - name: Commit obfuscated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add obfuscated

          if git diff --cached --quiet; then
            echo "No obfuscation changes detected"
            exit 0
          fi

          git commit -m "chore: auto-obfuscate lua [skip ci]"
          git push